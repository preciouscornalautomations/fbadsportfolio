<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- EDIT: title, description, and social tags (also set src/content/site.ts) -->
    <title>Precious Cornal | Facebook Ads Specialist</title>
    <meta
      name="description"
      content="Facebook and Instagram ads specialist. Lead generation, e-commerce sales, retargeting, ad creatives and Pixel + Conversions API tracking for service businesses, coaches and online stores."
    />
    <meta name="theme-color" content="#070b14" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Precious Cornal | Facebook Ads Specialist"
    />
    <meta
      property="og:description"
      content="Lead generation, online sales, retargeting and tracking that shows where every lead came from."
    />
    <meta property="og:image" content="/images/social/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apply the saved theme before first paint so the page never flashes -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark")
            document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
